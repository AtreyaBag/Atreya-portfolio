<style>
:root{
  --ink:#0E1B2E; --ink-2:#15263F; --line:rgba(242,238,228,.10);
  --text:#F2EEE4; --muted:#9FB0C8; --teal:#4FB3A2; --amber:#E3A94B; --red:#E0645A;
  --font:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--ink)}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html.locked,html.locked body{overflow:hidden;touch-action:none}
a{color:var(--teal)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

#scene{position:fixed;inset:0;width:100vw;height:100vh;display:block;pointer-events:none;z-index:0}
body.gaming #scene{pointer-events:auto;cursor:crosshair}

/* letterbox bars for the cinematic opening */
.bar{position:fixed;left:0;right:0;height:13vh;background:#060B14;z-index:30;transition:transform 1.6s cubic-bezier(.7,0,.2,1)}
.bar.top{top:0}.bar.bottom{bottom:0}
body.entered .bar.top{transform:translateY(-100%)}
body.entered .bar.bottom{transform:translateY(100%)}

/* intro gate */
#intro{position:fixed;inset:0;z-index:40;display:grid;place-items:center;text-align:center;padding:24px;
  background:radial-gradient(ellipse at 50% 55%,rgba(79,179,162,.08),transparent 60%),#0A1424;transition:opacity 1.2s ease}
body.entered #intro{opacity:0;pointer-events:none}
#intro .inner{max-width:560px}
#intro .lead{font-size:clamp(15px,2vw,18px);color:var(--muted);margin:0 0 6px}
#intro h2{font-weight:500;font-size:clamp(28px,5vw,46px);line-height:1.15;margin:0 0 30px;letter-spacing:-.01em}
#intro .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--text);padding:13px 22px;border-radius:999px;font-size:16px;cursor:pointer;transition:background .25s,border-color .25s,transform .25s}
.btn:hover{border-color:var(--teal);transform:translateY(-1px)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#0A1424;font-weight:600}
.btn.primary:hover{background:#63c4b3}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:4px;cursor:pointer;font-size:15px;margin-top:22px}
.linkish:hover{color:var(--text)}
#intro .note{font-size:13px;color:var(--muted);margin-top:14px;opacity:.8}

/* hud */
#hud{position:fixed;z-index:20;left:max(18px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px;opacity:0;transition:opacity 1s .8s}
body.entered #hud{opacity:1}
#hud button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 0;text-align:left}
#hud .dot{width:9px;height:9px;border-radius:50%;border:1px solid var(--muted);flex:none;transition:all .4s}
#hud .lbl{opacity:0;transform:translateX(-4px);transition:all .3s;background:rgba(10,20,36,.92);border:1px solid var(--line);padding:3px 9px;border-radius:6px;white-space:nowrap;pointer-events:none}
#hud:hover .lbl{opacity:1;transform:none}
#hud button.active{color:var(--text)}
#hud button.active .dot{background:var(--teal);border-color:var(--teal);box-shadow:0 0 12px var(--teal)}
#hud button.done .dot{background:rgba(79,179,162,.35);border-color:var(--teal)}

#topbar{position:fixed;z-index:20;top:calc(14px + env(safe-area-inset-top,0px));right:18px;display:flex;gap:8px;opacity:0;transition:opacity 1s .8s}
body.entered #topbar{opacity:1}
.chip{border:1px solid var(--line);background:rgba(14,27,46,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--text);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--teal)}

#progress{position:fixed;z-index:20;left:0;bottom:0;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--teal),var(--amber))}

/* story */
#story{position:relative;z-index:10}
.chapter{position:relative;min-height:var(--h,170vh)}
.panel{position:sticky;top:calc(50vh - 180px);max-width:430px;margin-left:clamp(70px,9vw,140px);padding:26px 28px;border-radius:18px;
  background:linear-gradient(160deg,rgba(21,38,63,.78),rgba(14,27,46,.62));border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.panel.right{margin-left:auto;margin-right:clamp(24px,7vw,120px)}
.panel.show{opacity:1;transform:none}
.panel .stage{font-size:13px;color:var(--teal);margin:0 0 8px;letter-spacing:.01em}
.panel .meta{font-size:14px;color:var(--muted);margin:-4px 0 10px}
.panel .lead{color:var(--text);font-size:16.5px;margin:0 0 14px}
.panel h3{font-size:14px;font-weight:600;color:var(--text);margin:16px 0 6px}
.panel .group{padding-top:12px;margin-top:12px;border-top:1px solid var(--line)}
.panel .group h3{margin-top:0}
.panel ul.items{margin:0;padding-left:18px;font-size:15px}
.panel ul.items li{margin:0 0 6px}
.panel .after{font-size:15px;margin-top:12px}
.tl{list-style:none;margin:6px 0 0;padding:0}
.tl > li{display:grid;grid-template-columns:108px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.45}
.tl .tags{margin:6px 0 0}
.tl .when{color:var(--muted);font-size:13px;padding-top:2px}
.tl .note{display:block;color:#C9C5BC;margin-top:2px}
.facts{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.facts li{font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid rgba(79,179,162,.35);color:var(--text);background:rgba(14,27,46,.5)}
.panel.wide{max-width:520px;position:relative;top:auto !important;margin-top:18vh}
#finale{padding-bottom:12vh}
.skills{display:grid;gap:8px}
.skillrow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center}
.skillrow .sg{font-size:13px;color:var(--muted)}
.skillrow .tags{margin:0}
.emailline{margin:0 0 8px;font-size:15px}
.emailline a{color:var(--text);text-decoration:none;border-bottom:1px solid rgba(79,179,162,.5)}
.panel h2{font-size:clamp(24px,2.6vw,32px);line-height:1.2;font-weight:600;margin:0 0 12px;letter-spacing:-.01em}
.panel p{margin:0 0 12px;color:#DCD8CF}
.panel ul{margin:0 0 6px;padding-left:18px;color:#DCD8CF}
.panel li{margin:0 0 8px}
.panel .role{color:var(--muted);font-size:15px;margin-top:-6px}
.panel .more{display:none;background:none;border:0;color:var(--teal);padding:0;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
body.plain .panel .more{display:none !important}
body.plain .panel .detail,body.plain .panel .after{display:block !important}
.award{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:12px;border:1px solid rgba(227,169,75,.35);background:rgba(227,169,75,.08);font-size:15px}
.award .star{color:var(--amber);font-size:20px;line-height:1.2}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;padding:0;list-style:none}
.tags li{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin:0;cursor:default;
  transition:color .25s,border-color .25s,background .25s,box-shadow .25s,transform .25s}
.tags li:hover,.tags li:active{color:var(--text);border-color:var(--teal);background:rgba(79,179,162,.14);
  box-shadow:0 0 16px rgba(79,179,162,.55),inset 0 0 8px rgba(79,179,162,.25);transform:translateY(-1px)}
.certs{list-style:none;padding:0;margin:8px 0 14px}
.certs li{padding:10px 0;border-bottom:1px solid var(--line)}
.certs li:last-child{border-bottom:0}
.certs span{display:block;color:var(--muted);font-size:14px}
.contact{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.contact a{text-decoration:none}

/* intro chapter: the particles carry the name, the panel sits low */
#intro-ch .panel{position:absolute;top:66vh;bottom:auto;left:50%;margin:0;transform:translate(-50%,24px);text-align:center;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;max-width:640px;width:calc(100% - 40px)}
#intro-ch .panel.show{transform:translate(-50%,0)}
#intro-ch h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#intro-ch .sub{font-size:clamp(17px,2.2vw,22px);color:var(--text);margin:0 0 6px}
#intro-ch .hint{font-size:14px;color:var(--muted);margin-top:18px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

/* game */
#game{position:fixed;inset:0;z-index:25;pointer-events:none;opacity:0;transition:opacity .5s}
body.gaming #game{opacity:1}
#game .stats{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:10px}
#game .stat{white-space:nowrap;padding:8px 16px;border-radius:999px;background:rgba(14,27,46,.7);border:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
#game .stat b{font-weight:600}
#game .stat.ok b{color:var(--teal)}#game .stat.bad b{color:var(--red)}#game .stat.spd b{color:var(--amber)}
#game .tip small{font-size:.65em;color:var(--muted)}
#game .timer{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(320px,70vw);height:4px;border-radius:4px;background:rgba(242,238,228,.12);overflow:hidden}
#game .timer i{display:block;height:100%;width:100%;background:var(--teal);transform-origin:0 50%}
#game .skip{position:absolute;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));pointer-events:auto}
#game .tip{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:clamp(18px,2.6vw,26px);text-align:center;transition:opacity .6s;text-shadow:0 2px 20px rgba(0,0,0,.6);width:90%}
#flash{position:fixed;inset:0;z-index:24;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(224,100,90,.45));opacity:0;transition:opacity .35s}
body.gaming .panel{opacity:0 !important;pointer-events:none}
body.gaming #story{pointer-events:none}
body.gaming #hud,body.gaming #topbar{opacity:0;pointer-events:none}

.result{margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(79,179,162,.08);font-size:15px}
.result b{color:var(--teal)}

/* summary / no-webgl mode */
body.plain #scene,body.plain #hud,body.plain .bar,body.plain #intro,body.plain #progress,body.plain #game{display:none !important}
body.plain .chapter{min-height:0;padding:28px 0}
body.plain .panel,body.plain .panel.right,body.plain .panel.wide,body.plain #intro-ch .panel{position:relative !important;top:auto !important;bottom:auto !important;left:auto !important;opacity:1;transform:none !important;margin:0 auto !important;max-width:720px;width:calc(100% - 32px)}
body.plain .panel.wide{margin-top:0}
.plain-only{display:none}
body.plain .plain-only{display:inline}
body.plain .imm-only{display:none}
body.plain #intro-ch .panel{position:relative;left:auto;bottom:auto;transform:none;text-align:left;background:linear-gradient(160deg,rgba(21,38,63,.78),rgba(14,27,46,.62));border:1px solid var(--line)}
body.plain #intro-ch h1{position:static;width:auto;height:auto;clip:auto;font-size:40px;margin:0 0 4px}
body.plain #intro-ch .hint,body.plain .play-only{display:none}
body.plain #topbar{opacity:1}

@media (max-width:760px){
  .panel,.panel.right{margin:0 12px;max-width:none;position:sticky;top:calc(100vh - 16px - var(--ph,300px));padding:18px 20px}
  .panel .more{display:inline-block}
  .panel:not(.open) .detail,.panel:not(.open) .after{display:none}
  .tl > li{grid-template-columns:1fr;gap:2px}
  .skillrow{grid-template-columns:1fr;gap:4px}
  .facts{justify-content:center}
  .panel h2{font-size:22px}
  #hud{display:none}
  body{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  .panel,.bar,#intro{transition:opacity .3s}
  #intro-ch .hint{animation:none}
}
</style>
</head>

    camCurve.getPoint(camT, camPos); lookCurve.getPoint(camT, lookPos);
    mouse.sx = lerp(mouse.sx, mouse.x, 0.05); mouse.sy = lerp(mouse.sy, mouse.y, 0.05);
    const sway = reduceMotion || game.active ? 0 : 1;
    camera.position.set(camPos.x + mouse.sx * 1.2 * sway + Math.sin(time * 0.3) * 0.3 * sway, camPos.y - mouse.sy * 0.8 * sway + Math.cos(time * 0.4) * 0.2 * sway, camPos.z);
    camera.lookAt(lookPos);
    const fin = smooth(clamp((camT * (N - 1)) - (N - 2), 0, 1));
    scene.fog.density = lerp(0.014, 0.0012, fin);
    if (bloom) bloom.strength = lerp(0.9, 1.5, fin);
    pipe.material.opacity = game.active ? 0.2 : lerp(0.55, 1, fin);
    pipeGlow.material.opacity = fin * 0.22;
    beacons.forEach(b => { const on = smooth(clamp(fin * 1.6 - b.k * 0.12, 0, 1)); b.halo.material.opacity = on * (0.55 + Math.sin(time * 2 + b.k) * 0.12); b.lab.material.opacity = on; });
    flowMat.size = lerp(0.2, 0.55, fin);
    flowMat.opacity = game.active ? 0.25 : 0.9;

    // name particles assemble after entering, then disperse as you travel
    if (nameStart >= 0) nameT = clamp((time - nameStart) / (reduceMotion ? 0.3 : 3.2), 0, 1);
    const e = 1 - Math.pow(1 - nameT, 4), away = smooth(clamp(camT * (N - 1) * 1.6, 0, 1));
    for (let i = 0; i < nameN; i++) {
      const k = i * 3, w = Math.sin(time * 1.3 + i) * 0.03;
      namePos[k] = lerp(nameFrom[k], nameTo[k], e) + (nameFrom[k] - nameTo[k]) * away * 0.6;
      namePos[k + 1] = lerp(nameFrom[k + 1], nameTo[k + 1], e) + w + away * (nameFrom[k + 1] * 0.3);
      namePos[k + 2] = lerp(nameFrom[k + 2], nameTo[k + 2], e) + away * 12;
    }
    nameGeo.attributes.position.needsUpdate = true;
    nameMat.opacity = 0.95 * (1 - away * 0.85);

    // data flowing along the pipe
    for (let i = 0; i < flowN; i++) {
      flowU[i] = (flowU[i] + flowSpd[i] * dt * (1 + energy * 4)) % 1;
      pipeCurve.getPoint(flowU[i], tmpV);
      flowPos[i * 3] = tmpV.x + flowOff[i * 3]; flowPos[i * 3 + 1] = tmpV.y + flowOff[i * 3 + 1]; flowPos[i * 3 + 2] = tmpV.z + flowOff[i * 3 + 2];
    }
    flowGeo.attributes.position.needsUpdate = true;

    // the packet ("you") floats ahead of the camera and follows the pointer
    fwd.subVectors(lookPos, camPos).normalize();
    packet.position.copy(camera.position).addScaledVector(fwd, 7);
    packet.position.x += mouse.sx * 1.4; packet.position.y += -mouse.sy * 0.9 - 1.9;
    pShell.rotation.x += dt * 0.9; pShell.rotation.y += dt * 1.3; pCore.rotation.y -= dt * 2;
    pGlow.material.opacity = 0.35 + Math.sin(time * 3) * 0.1;
    packet.visible = entered && !game.active && fin < 0.5 && camT * (N - 1) > 0.35;
    trailPos.copyWithin(3, 0, (trailN - 1) * 3); trailPos.set([packet.position.x, packet.position.y, packet.position.z], 0);
    trailGeo.attributes.position.needsUpdate = true; trail.visible = packet.visible;

    // station 1: racks blink
    if (Math.random() < 0.35) { const i = Math.floor(Math.random() * leds.count); ledC.setHex(Math.random() < 0.18 ? COL.amber : Math.random() < 0.5 ? COL.teal : 0x1a2a40); leds.setColorAt(i, ledC); leds.instanceColor.needsUpdate = true; }

    // station 2: DAG lights up task by task as you scroll through it
    const lp2 = st.i === 2 ? st.lp : st.i > 2 ? 1 : 0;
    nodes.forEach(n => { const on = clamp((lp2 * 1.5 - n.userData.col * 0.2) * 3, 0, 1); n.material.emissiveIntensity = on * (1.4 + Math.sin(time * 4 + n.userData.col) * 0.2); n.scale.setScalar(1 + on * 0.12); });
    edges.forEach(ed => { ed.material.opacity = 0.08 + clamp((lp2 * 1.5 - ed.userData.col * 0.2 - 0.1) * 3, 0, 1) * 0.8; });
    if (!burstDone && lp2 > 0.72 && entered) { burstDone = true; fireBurst(); }
    if (burstT >= 0) {
      burstT += dt;
      for (let i = 0; i < burstN; i++) { burstPos[i * 3] += burstVel[i].x * dt; burstPos[i * 3 + 1] += burstVel[i].y * dt; burstPos[i * 3 + 2] += burstVel[i].z * dt; burstVel[i].multiplyScalar(0.97); }
      burstGeo.attributes.position.needsUpdate = true; burstMat.opacity = clamp(1 - burstT / 3, 0, 1);
      if (burstT > 3) burstT = -1;
    }

    // station 3: gate idles, spins faster during the game
    const spin = game.active ? 1.2 : 0.25;
    ticks.rotation.z += dt * spin; ring2.rotation.z -= dt * spin * 0.6;
    scan.material.opacity = game.active ? 0.0 : 0.035 + Math.sin(time * 2) * 0.015;
    if (game.active) updateGame(dt, rawDt);
    for (let i = 0; i < shardN; i++) if (shardLife[i] > 0) {
      shardLife[i] -= dt * 1.4; const k = i * 3;
      shardPos[k] += shardVel[k] * dt; shardPos[k + 1] += shardVel[k + 1] * dt; shardPos[k + 2] += shardVel[k + 2] * dt;
      if (shardLife[i] <= 0) shardPos[k + 1] = -999;
    }
    shardGeo.attributes.position.needsUpdate = true;

    // station 4: blocks fall into their layers
    const lp4 = st.i === 3 ? st.lp : st.i > 3 ? 1 : 0;
    blocks.forEach(b => {
      const k = smooth(clamp((lp4 * 1.35 - b.userData.order * 0.8) * 3, 0, 1));
      b.position.lerpVectors(b.userData.from, b.userData.tgt, k);
      b.material.opacity = k; b.rotation.y = (1 - k) * 3;
    });

    // station 5: galaxy turns, sentiment orbits the model
    ai.userData.galaxy.rotation.y += dt * 0.05;
    core.rotation.y += dt * 0.4; core.rotation.x += dt * 0.15; core.scale.setScalar(1 + Math.sin(time * 2) * 0.05);
    orbiters.forEach(o => { const u = o.userData; u.a += dt * u.s; o.position.set(Math.cos(u.a) * u.r, Math.sin(u.a * 1.3) * u.tilt * 1.5, Math.sin(u.a) * u.r); });

    if (composer) composer.render(); else renderer.render(scene, camera);
  }
  frame();

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight); if (composer) composer.setSize(innerWidth, innerHeight);
    measure(); fitFinale();
  });
  window.addEventListener('load', measure);
}
</script>
</body>
</html>
